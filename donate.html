<!doctype html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>支持 Colorful Background</title>
    <link rel="icon" type="image/svg+xml" href="https://ext-colorful.github.io/umbrella.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --paper: #f7f4ee;
            --ink: #191c22;
            --muted: #4d5461;
            --light: #8b8f99;
            --line: rgba(25, 28, 34, 0.12);
            --card: #fffdf9;
            --shadow: 0 1px 2px rgba(25, 28, 34, 0.04), 0 22px 48px -20px rgba(25, 28, 34, 0.14);
            --glow: rgba(63, 142, 247, 0.08);
            --dot: rgba(25, 28, 34, 0.07);
            --pp1: #003087;
            --pp2: #009cde;
            --ppb: #0070ba;
            --brand: #3f8ef7;
            /* 品牌三色：红 / 蓝 / 紫 */
            --c1: #ee5a4f;
            --c2: #3f8ef7;
            --c3: #9b6bf2;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #0d0f14;
                --ink: #ebe9e4;
                --muted: #b8bcc6;
                --light: #787d89;
                --line: rgba(235, 233, 228, 0.12);
                --card: #151821;
                --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 22px 48px -20px rgba(0, 0, 0, 0.55);
                --glow: rgba(155, 107, 242, 0.1);
                --dot: rgba(235, 233, 228, 0.07);
                --pp1: #79b0ff;
                --pp2: #6ec1ff;
                --ppb: #4d9fe8;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', sans-serif;
            background: var(--paper);
            color: var(--ink);
            transition: background 0.3s, color 0.3s;
            -webkit-font-smoothing: antialiased;
            line-height: 1.55;
        }

        /* 极淡点阵，给纸面一点质感 */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: radial-gradient(var(--dot) 1px, transparent 1.3px);
            background-size: 26px 26px;
            pointer-events: none;
            z-index: 0;
        }

        /* 跟随光标的柔和色晕 */
        .glow {
            position: fixed;
            left: 0;
            top: 0;
            width: 640px;
            height: 640px;
            border-radius: 50%;
            background: radial-gradient(closest-side, var(--glow), transparent 72%);
            pointer-events: none;
            z-index: 0;
            will-change: transform;
        }

        @media (hover: none) { .glow { display: none; } }

        ::selection { background: var(--brand); color: #fff; }

        a:focus-visible, button:focus-visible, .pp-bar:focus-visible {
            outline: 2px solid var(--brand);
            outline-offset: 2px;
            border-radius: 6px;
        }
        .pp-bar:focus-visible { outline-color: var(--ppb); }

        .page {
            position: relative;
            z-index: 1;
            max-width: 1140px;
            margin: 0 auto;
            padding: 22px 32px 26px;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* ---------- 顶栏 ---------- */
        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand { display: flex; align-items: center; gap: 12px; }

        .brand-name {
            font-size: 10.5px;
            font-weight: 800;
            letter-spacing: 0.22em;
            display: inline-flex;
            align-items: center;
        }

        .brand-char {
            display: inline-block;
            animation: float 2.6s ease-in-out infinite;
            animation-delay: calc(var(--i) * 90ms);
        }
        .brand-char:nth-child(3n + 1) { color: var(--c1); }
        .brand-char:nth-child(3n + 2) { color: var(--c2); }
        .brand-char:nth-child(3n)     { color: var(--c3); }
        .brand-space { width: 0.55em; flex: 0 0 auto; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-2px); }
        }

        .lang-toggle {
            display: flex;
            gap: 2px;
            padding: 3px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--card);
        }

        button.lang {
            border: none;
            background: transparent;
            color: var(--muted);
            padding: 5px 13px;
            border-radius: 999px;
            cursor: pointer;
            font: 600 12px/1 inherit;
            font-family: inherit;
            transition: color 0.25s, background 0.3s;
        }
        button.lang:hover { color: var(--ink); }
        button.lang.active { background: var(--ink); color: var(--paper); }

        /* ---------- 主区 ---------- */
        .main {
            flex: 1;
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            gap: 56px;
            align-items: center;
            padding: 26px 0;
        }

        h1 {
            font-family: 'Fraunces', 'Noto Serif SC', 'Songti SC', serif;
            font-weight: 600;
            font-size: clamp(32px, 4.2vw, 54px);
            line-height: 1.18;
            letter-spacing: 0.01em;
            margin: 0;
            min-height: 1.2em;
        }

        .mark {
            display: flex;
            width: 64px;
            height: 4px;
            border-radius: 2px;
            overflow: hidden;
            margin: 16px 0 20px;
        }
        .mark i { flex: 1; }

        .lede {
            margin: 0;
            max-width: 34em;
            font-size: 15px;
            color: var(--muted);
        }

        .meta { margin-top: 14px; font-size: 13px; font-weight: 600; color: var(--muted); }
        .meta i.mdot {
            display: inline-block;
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--c);
            margin: 0 11px;
            vertical-align: 2px;
        }

        .ticks {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 24px;
            margin: 18px 0 4px;
            padding: 0;
            list-style: none;
        }
        .ticks li {
            display: flex;
            gap: 10px;
            align-items: baseline;
            font-size: 13.5px;
            color: var(--muted);
        }
        .ticks li i {
            flex: none;
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--c);
            transform: translateY(-1px);
        }

        /* 三个跳转入口 */
        .stores { margin-top: 22px; }
        .store {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 2px;
            border-top: 1px solid var(--line);
            text-decoration: none;
            color: inherit;
            transition: padding-left 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .store:last-child { border-bottom: 1px solid var(--line); }
        .store:hover { padding-left: 10px; }

        .store .ic {
            flex: none;
            width: 36px; height: 36px;
            border-radius: 11px;
            border: 1px solid var(--line);
            display: grid;
            place-items: center;
            color: var(--muted);
            transition: color 0.25s, border-color 0.25s, background 0.25s;
        }
        .store:hover .ic {
            color: var(--b);
            border-color: var(--b);
            background: color-mix(in srgb, var(--b) 8%, transparent);
        }

        .s-main { font-size: 14px; font-weight: 650; }
        .s-sub  { margin-left: auto; font-size: 12px; color: var(--light); }
        .s-arrow {
            color: var(--b);
            display: grid;
            place-items: center;
            opacity: 0;
            transform: translateX(-6px);
            transition: opacity 0.25s, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .store:hover .s-arrow { opacity: 1; transform: none; }

        /* ---------- 右侧支持面板 ---------- */
        .panel {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .panel-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .eyebrow {
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--light);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .eyebrow::before { content: ""; width: 14px; height: 1px; background: var(--light); }

        .panel-note { font-size: 12px; color: var(--light); }

        .pay-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .pay-card {
            position: relative;
            overflow: hidden;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 14px 14px 12px;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s;
        }
        .pay-card:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--b) 40%, transparent); }

        .pay-card h3 {
            margin: 0 0 10px;
            font-size: 13.5px;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 7px;
        }
        .pay-card h3 i {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--b);
        }

        /* 二维码容器固定白底，保证暗色模式下也能扫 */
        .qr {
            background: #fff;
            border-radius: 12px;
            box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.06);
        }
        .qr img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            border-radius: 6px;
        }

        .pay-card .tip {
            margin: 9px 0 0;
            text-align: center;
            font-size: 11.5px;
            font-weight: 600;
            color: var(--light);
        }

        /* ---------- PayPal 横条：结构不变、保持一行，仅整条可点 ---------- */
        .pp-bar {
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: nowrap;              /* 始终一行 */
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 10px 14px;
            cursor: pointer;                /* 整条可点 */
            transition: border-color 0.25s, box-shadow 0.3s;
        }
        .pp-bar:hover {
            border-color: color-mix(in srgb, var(--ppb) 45%, transparent);
            box-shadow: 0 10px 26px -14px color-mix(in srgb, var(--ppb) 45%, transparent);
        }

        .pp-info { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .pp-word { font-size: 17px; font-weight: 800; font-style: italic; letter-spacing: -0.02em; white-space: nowrap; }
        .pp-word b  { color: var(--pp1); font-weight: 800; }
        .pp-word em { color: var(--pp2); font-style: italic; }
        .pp-tip { font-size: 12px; color: var(--light); }

        .pp-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .pp-actions a {
            text-decoration: none;
            padding: 7px 18px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--ink);
            font-size: 13px;
            font-weight: 700;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), filter 0.2s, border-color 0.2s;
        }
        .pp-actions a:hover { transform: translateY(-2px); border-color: var(--ppb); }
        .pp-actions a:active { transform: scale(0.95); }
        .pp-actions a.featured {
            background: var(--ppb);
            border-color: var(--ppb);
            color: #fff;
            box-shadow: 0 4px 14px -4px color-mix(in srgb, var(--ppb) 60%, transparent);
        }
        .pp-actions a.featured:hover { filter: brightness(1.08); }

        /* ---------- 底部 ---------- */
        .bottom {
            border-top: 1px solid var(--line);
            padding-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .sponsors-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .sponsors-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.2em;
            color: var(--light);
        }

        .sponsor-chip {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 5px 12px 5px 6px;
            border-radius: 999px;
            background: var(--card);
            border: 1px solid var(--line);
            transition: border-color 0.25s;
        }
        .sponsor-chip:hover { border-color: color-mix(in srgb, var(--brand) 40%, transparent); }

        .sponsor-avatar {
            width: 22px; height: 22px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .sponsor-name { font-size: 12.5px; font-weight: 650; }
        .sponsor-amount { font-size: 11px; font-weight: 600; color: var(--light); }

        .sponsors-cta { font-size: 12px; color: var(--light); }
        .sponsors-cta i {
            display: inline-block;
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--c3);
            margin-left: 6px;
            vertical-align: 1px;
        }

        .copyright {
            margin: 0;
            text-align: center;
            font-size: 12px;
            color: var(--light);
        }

        /* ---------- 入场动效 ---------- */
        @keyframes rise {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .anim { opacity: 0; animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .d1 { animation-delay: 0.05s; }
        .d2 { animation-delay: 0.18s; }
        .d3 { animation-delay: 0.32s; }

        .store { opacity: 0; animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: calc(0.34s + var(--i) * 70ms); }
        .pay-card { opacity: 0; animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: calc(0.3s + var(--i) * 90ms); }

        @media (max-width: 1023px) {
            .main {
                grid-template-columns: 1fr;
                gap: 36px;
                align-content: start;
                padding: 34px 0;
            }
            .intro { max-width: 620px; }
            .panel { max-width: 480px; }
        }

        @media (max-width: 640px) {
            .page { padding: 18px 20px 24px; }
            .ticks { grid-template-columns: 1fr; }
            .pp-tip { display: none; }          /* 窄屏隐藏提示文字，保证横条仍是一行 */
            .pp-actions a { padding: 7px 13px; }
            .s-sub { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .brand-char, .anim, .store, .pay-card { animation: none; opacity: 1; }
            .store, .pay-card, .pp-bar, .pp-actions a, button.lang { transition: none; }
            .glow { display: none; }
        }
    </style>
</head>

<body>
    <div class="glow" id="glow" aria-hidden="true"></div>

    <div class="page">
        <!-- 顶栏 -->
        <header class="top anim d1">
            <div class="brand">
                <!-- 伞 Logo：三彩伞面 -->
                <svg width="30" height="30" viewBox="0 0 48 48" fill="none" aria-hidden="true">
                    <path d="M6 25A18 18 0 0 1 15 9.41" stroke="#ee5a4f" stroke-width="3.4" stroke-linecap="round"/>
                    <path d="M15 9.41A18 18 0 0 1 33 9.41" stroke="#3f8ef7" stroke-width="3.4" stroke-linecap="round"/>
                    <path d="M33 9.41A18 18 0 0 1 42 25" stroke="#9b6bf2" stroke-width="3.4" stroke-linecap="round"/>
                    <path d="M24 25v12a4.5 4.5 0 0 1-9 0" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                    <path d="M24 7V4" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                </svg>
                <span class="brand-name" id="brand-name" aria-label="COLORFUL BACKGROUND"></span>
            </div>
            <div class="lang-toggle">
                <button class="lang" id="btn-en" onclick="render('en')">EN</button>
                <button class="lang" id="btn-zh" onclick="render('zh')">中文</button>
            </div>
        </header>

        <!-- 主区 -->
        <main class="main">
            <section class="intro anim d1">
                <h1 id="t-title"></h1>
                <span class="mark" aria-hidden="true">
                    <i style="background:var(--c1)"></i><i style="background:var(--c2)"></i><i style="background:var(--c3)"></i>
                </span>
                <p class="lede" id="t-lede"></p>
                <div class="meta" id="t-meta"></div>
                <ul class="ticks" id="t-ticks"></ul>

                <nav class="stores" aria-label="links">
                    <a class="store" style="--b:#4285f4;--i:0" href="https://chromewebstore.google.com/detail/%E5%A4%9A%E5%BD%A9%E8%83%8C%E6%99%AF/kjdglnecpmkeokdeboehpaajdddhommg" target="_blank" rel="noopener noreferrer">
                        <span class="ic">
                            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/>
                                <line x1="21.17" y1="8" x2="12" y2="8"/>
                                <line x1="3.95" y1="6.06" x2="8.54" y2="14"/>
                                <line x1="10.88" y1="21.94" x2="15.46" y2="14"/>
                            </svg>
                        </span>
                        <span class="s-main"></span>
                        <span class="s-sub"></span>
                        <span class="s-arrow">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M5 12h14"/><path d="M12 5l7 7-7 7"/>
                            </svg>
                        </span>
                    </a>
                    <a class="store" style="--b:#0b93d6;--i:1" href="https://microsoftedge.microsoft.com/addons/detail/pndeoniljijhiemfdogejkhmbggpognj" target="_blank" rel="noopener noreferrer">
                        <span class="ic">
                            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                                <circle cx="12" cy="12" r="10"/>
                                <path d="M4.2 14.3C8.4 11.8 15.6 11.8 19.8 9.4"/>
                            </svg>
                        </span>
                        <span class="s-main"></span>
                        <span class="s-sub"></span>
                        <span class="s-arrow">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M5 12h14"/><path d="M12 5l7 7-7 7"/>
                            </svg>
                        </span>
                    </a>
                    <a class="store" style="--b:var(--ink);--i:2" href="https://github.com/ext-colorful/ext-colorful/issues/new/choose" target="_blank" rel="noopener noreferrer">
                        <span class="ic">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
                            </svg>
                        </span>
                        <span class="s-main"></span>
                        <span class="s-sub"></span>
                        <span class="s-arrow">
                            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M5 12h14"/><path d="M12 5l7 7-7 7"/>
                            </svg>
                        </span>
                    </a>
                </nav>
            </section>

            <!-- 支持面板 -->
            <section class="panel anim d2" aria-label="support">
                <div class="panel-head">
                    <span class="eyebrow" id="t-eyebrow"></span>
                    <span class="panel-note" id="t-panelnote"></span>
                </div>

                <div class="pay-grid">
                    <div class="pay-card" style="--b:#07c160;--i:0">
                        <h3><i></i><span id="title-wechat"></span></h3>
                        <div class="qr"><img src="https://ext-colorful.github.io/images/wechat_a2.png" alt="WeChat Pay QR" /></div>
                        <p class="tip" id="tip-wechat"></p>
                    </div>
                    <div class="pay-card" style="--b:#1677ff;--i:1">
                        <h3><i></i><span id="title-alipay"></span></h3>
                        <div class="qr"><img src="https://ext-colorful.github.io/images/alipay_a2.png" alt="Alipay QR" /></div>
                        <p class="tip" id="tip-alipay"></p>
                    </div>
                </div>

                <!-- 结构与之前完全一致：一行横条 + 三个普通链接，仅多一个 JS 点击事件 -->
                <div class="pp-bar" id="pp-bar" tabindex="0" role="button">
                    <div class="pp-info">
                        <span class="pp-word" aria-hidden="true"><b>Pay</b><em>Pal</em></span>
                        <span class="pp-tip" id="tip-paypal"></span>
                    </div>
                    <div class="pp-actions">
                        <a href="https://paypal.me/yxuiang/3" target="_blank" rel="noopener noreferrer">$3</a>
                        <a href="https://paypal.me/yxuiang/5" class="featured" target="_blank" rel="noopener noreferrer">$5</a>
                        <a href="https://paypal.me/yxuiang/10" target="_blank" rel="noopener noreferrer">$10</a>
                    </div>
                </div>
            </section>
        </main>

        <!-- 底部 -->
        <footer class="bottom anim d3">
            <div class="sponsors-row">
                <span class="sponsors-label" id="t-sponsorslabel"></span>
                <span id="t-sponsors" style="display:inline-flex;gap:8px;flex-wrap:wrap;justify-content:center"></span>
                <span class="sponsors-cta" id="t-cta"></span>
            </div>
            <p class="copyright" id="t-footer"></p>
        </footer>
    </div>

    <script>
        const dotColors = ["#ee5a4f", "#3f8ef7", "#9b6bf2", "#e8a33d"];
        const tickColors = ["#ee5a4f", "#3f8ef7", "#9b6bf2", "#e8a33d"];

        const dict = {
            en: {
                pageTitle: "Support Colorful Background",
                title: "Keep the Colors Growing",
                lede: "Thanks to every supporter — your encouragement is what keeps Colorful Background shipping, improving, and staying free.",
                stats: ["1,000+ users", "Indie built", "Actively maintained", "Always free"],
                ticks: [
                    "Continuously delivering more stunning themes and motion experiences",
                    "Prioritizing new features and performance improvements",
                    "Hunting edge-case bugs with long-term reliable maintenance",
                    "Making every browser launch feel more comfortable and healing"
                ],
                stores: [
                    { main: "Chrome Web Store", sub: "Add to Chrome" },
                    { main: "Edge Add-ons", sub: "Add to Edge" },
                    { main: "GitHub Issues", sub: "Share feedback" }
                ],
                eyebrow: "Support",
                panelNote: "Buy the dev a coffee",
                wechatTitle: "WeChat Pay",
                wechatTip: "Scan via WeChat",
                alipayTitle: "Alipay",
                alipayTip: "Scan via Alipay",
                paypalTip: "Donate via PayPal",
                sponsorsLabel: "SUPPORTERS",
                sponsorsCta: "Your name could be next — every bit of support matters",
                footer: "Built with passion by an independent developer · Thank you for your support"
            },
            zh: {
                pageTitle: "支持 Colorful Background · 让色彩持续绽放",
                title: "让色彩持续绽放",
                lede: "感谢每一位支持者——你的鼓励与支持，都是 Colorful Background 持续更新、越做越好的动力。",
                stats: ["1,000+ 用户", "独立开发", "持续维护", "始终免费"],
                ticks: [
                    "持续带来更惊艳的主题与动效体验",
                    "优先投入新功能开发与性能提升",
                    "跨平台 Bug 追击与长期的稳定维护",
                    "让每一次打开浏览器，都更舒适治愈"
                ],
                stores: [
                    { main: "Chrome 应用商店", sub: "添加至 Chrome" },
                    { main: "Microsoft Edge 加载项", sub: "添加至 Edge" },
                    { main: "GitHub Issues", sub: "反馈问题" }
                ],
                eyebrow: "Support",
                panelNote: "请作者喝一杯咖啡",
                wechatTitle: "微信支付",
                wechatTip: "微信扫码",
                alipayTitle: "支付宝",
                alipayTip: "支付宝扫码",
                paypalTip: "点击跳转至 PayPal 页面",
                sponsorsLabel: "支持者",
                sponsorsCta: "你的名字也可以出现在这里——每一份支持都被铭记",
                footer: "由独立开发者用热爱打造 · 感谢你的支持"
            }
        };

        const sponsors = [
            { name: "匿名小伙伴", amount: "¥5.20", color: "linear-gradient(135deg, #ee5a4f, #f5a623)" }
        ];

        function initBrandName() {
            let i = 0;
            document.getElementById("brand-name").innerHTML = "COLORFUL BACKGROUND"
                .split("")
                .map(ch => ch === " "
                    ? '<span class="brand-space" aria-hidden="true"></span>'
                    : `<span class="brand-char" style="--i:${i++}" aria-hidden="true">${ch}</span>`)
                .join("");
        }

        function render(lang) {
            const data = dict[lang];

            document.title = data.pageTitle;
            document.getElementById("t-title").innerText = data.title;
            document.getElementById("t-lede").innerText = data.lede;
            document.getElementById("t-footer").innerText = data.footer;

            // 统计行：彩点分隔
            document.getElementById("t-meta").innerHTML = data.stats
                .map((s, i) => `${i ? `<i class="mdot" style="--c:${dotColors[i % dotColors.length]}"></i>` : ""}<span>${s}</span>`)
                .join("");

            // 特性：四色圆点
            document.getElementById("t-ticks").innerHTML = data.ticks
                .map((t, i) => `<li style="--c:${tickColors[i % tickColors.length]}"><i></i><span>${t}</span></li>`)
                .join("");

            // 三个跳转入口
            document.querySelectorAll(".store").forEach((a, i) => {
                const d = data.stores[i];
                a.querySelector(".s-main").textContent = d.main;
                a.querySelector(".s-sub").textContent = d.sub;
            });

            // 支付面板
            document.getElementById("t-eyebrow").textContent = data.eyebrow;
            document.getElementById("t-panelnote").textContent = data.panelNote;
            document.getElementById("title-wechat").textContent = data.wechatTitle;
            document.getElementById("tip-wechat").textContent = data.wechatTip;
            document.getElementById("title-alipay").textContent = data.alipayTitle;
            document.getElementById("tip-alipay").textContent = data.alipayTip;
            document.getElementById("tip-paypal").textContent = data.paypalTip;

            // 支持者
            document.getElementById("t-sponsorslabel").textContent = data.sponsorsLabel;
            document.getElementById("t-cta").innerHTML = `${data.sponsorsCta}<i aria-hidden="true"></i>`;
            document.getElementById("t-sponsors").innerHTML = sponsors
                .map(s => `<span class="sponsor-chip">
                    <span class="sponsor-avatar" style="background:${s.color}">${s.name.charAt(0)}</span>
                    <span class="sponsor-name">${s.name}</span>
                    <span class="sponsor-amount">${s.amount}</span>
                </span>`)
                .join("");

            document.querySelectorAll("button.lang").forEach(btn => {
                const on = btn.id === `btn-${lang}`;
                btn.classList.toggle("active", on);
                btn.setAttribute("aria-pressed", on);
            });
        }

        function getDefaultLang() {
            const param = new URLSearchParams(location.search).get("lang");
            if (param && param !== "default") {
                const base = param.toLowerCase().replace(/_/g, "-").split("-")[0];
                if (base === "zh" || base === "en") return base;
            }
            const locales = navigator.languages?.length ? navigator.languages : [navigator.language];
            return locales.some(l => l.toLowerCase().startsWith("zh")) ? "zh" : "en";
        }

        // ★ PayPal 横条整体可点：点到空白处默认打开 $5；点到内部金额链接则走链接自身
        (function initPaypalBar() {
            const bar = document.getElementById("pp-bar");
            const DEFAULT_URL = "https://paypal.me/yxuiang/5";
            const open = () => window.open(DEFAULT_URL, "_blank", "noopener");

            bar.addEventListener("click", e => {
                if (e.target.closest("a")) return;  // $3/$5/$10 链接自己跳，不干预
                open();
            });
            bar.addEventListener("keydown", e => {  // 键盘 Enter/空格 同样生效
                if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); }
            });
        })();

        // 光标跟随的柔和色晕（尊重系统减弱动效设置）
        (function initGlow() {
            const glow = document.getElementById("glow");
            const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
            if (!glow || reduce || !matchMedia("(hover: hover)").matches) {
                if (glow) glow.style.display = "none";
                return;
            }
            let tx = innerWidth * 0.62, ty = innerHeight * 0.42, x = tx, y = ty;
            addEventListener("pointermove", e => { tx = e.clientX; ty = e.clientY; }, { passive: true });
            (function loop() {
                x += (tx - x) * 0.07;
                y += (ty - y) * 0.07;
                glow.style.transform = `translate3d(${x}px, ${y}px, 0) translate(-50%, -50%)`;
                requestAnimationFrame(loop);
            })();
        })();

        initBrandName();
        render(getDefaultLang());
    </script>
</body>
</html>
