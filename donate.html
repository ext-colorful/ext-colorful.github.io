<!doctype html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Support Colorful Background — a free, indie-built browser extension for stunning themes and motion. Donate via WeChat Pay, Alipay, or PayPal." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Support Colorful Background" />
    <meta property="og:description" content="Keep the colors growing — support this free, indie-built browser extension. Donate via WeChat Pay, Alipay, or PayPal." />
    <meta property="og:image" content="https://ext-colorful.github.io/umbrella.svg" />
    <meta name="twitter:card" content="summary" />
    <title>支持 Colorful Background</title>
    <link rel="icon" type="image/svg+xml" href="https://ext-colorful.github.io/umbrella.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
    <style>
        :root {
            --paper: #f7f4ee;
            --ink: #191c22;
            --muted: #4d5461;
            --light: #636973;
            --line: rgba(25, 28, 34, 0.12);
            --card: #fffdf9;
            --shadow: 0 1px 2px rgba(25, 28, 34, 0.04), 0 22px 48px -20px rgba(25, 28, 34, 0.14);
            --glow: rgba(63, 142, 247, 0.12);
            --dot: rgba(25, 28, 34, 0.07);
            --pp1: #003087;
            --pp2: #009cde;
            --ppb: #0070ba;
            --brand: #3f8ef7;
            /* 品牌三色：红 / 蓝 / 紫 */
            --c1: #ee5a4f;
            --c2: #3f8ef7;
            --c3: #9b6bf2;
            /* 小咖啡杯图标（Support 标题前），mask 套用 --light 颜色、随主题自适应 */
            --cup: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%20fill='none'%20stroke='%23000'%20stroke-width='2'%20stroke-linecap='round'%20stroke-linejoin='round'%3E%3Cpath%20d='M4%209h13v4a4%204%200%200%201-4%204H8a4%204%200%200%201-4-4V9z'/%3E%3Cpath%20d='M17%2010h2.5a2.5%202.5%200%200%201%200%205H17'/%3E%3Cpath%20d='M8%203c0%201-1%201.5-1%202.5M12%203c0%201-1%201.5-1%202.5'/%3E%3C/svg%3E");
            /* 小星星图标（引导语前），mask 套用 --c1 品牌红、随强调色一致 */
            --star: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2024%2024'%20fill='%23000'%3E%3Cpath%20d='M12%202l2.9%206.3%206.9.7-5.1%204.7%201.4%206.8L12%2017.8%205.9%2020.5l1.4-6.8L2.2%209l6.9-.7L12%202z'/%3E%3C/svg%3E");
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --paper: #0d0f14;
                --ink: #ebe9e4;
                --muted: #b8bcc6;
                --light: #787d89;
                --line: rgba(235, 233, 228, 0.12);
                --card: #151821;
                --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 22px 48px -20px rgba(0, 0, 0, 0.55);
                --glow: rgba(155, 107, 242, 0.15);
                --dot: rgba(235, 233, 228, 0.07);
                --pp1: #79b0ff;
                --pp2: #6ec1ff;
                --ppb: #4d9fe8;
            }
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Segoe UI', sans-serif;
            background: var(--paper);
            color: var(--ink);
            transition: background 0.3s, color 0.3s;
            -webkit-font-smoothing: antialiased;
            line-height: 1.55;
        }

        /* 极淡点阵，给纸面一点质感 */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background-image: radial-gradient(var(--dot) 1px, transparent 1.3px);
            background-size: 26px 26px;
            pointer-events: none;
            z-index: 0;
        }

        /* 跟随光标的柔和色晕 */
        .glow {
            position: fixed;
            left: 0;
            top: 0;
            width: 640px;
            height: 640px;
            border-radius: 50%;
            background: radial-gradient(closest-side, var(--glow), transparent 72%);
            pointer-events: none;
            z-index: 0;
            will-change: transform;
        }

        @media (hover: none) { .glow { display: none; } }

        ::selection { background: var(--brand); color: #fff; }

        a:focus-visible, button:focus-visible {
            outline: 2px solid var(--brand);
            outline-offset: 2px;
            border-radius: 6px;
        }

        .page {
            position: relative;
            z-index: 1;
            max-width: 1140px;
            margin: 0 auto;
            padding: 22px 32px 26px;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
        }

        /* ---------- 顶栏 ---------- */
        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand { display: flex; align-items: center; gap: 12px; }

        .brand-name {
            font-size: 10.5px;
            font-weight: 800;
            letter-spacing: 0.22em;
            display: inline-flex;
            align-items: center;
        }

        .brand-char {
            display: inline-block;
            animation: float 2.6s ease-in-out infinite;
            animation-delay: calc(var(--i) * 90ms);
        }
        .brand-char:nth-child(3n + 1) { color: var(--c1); }
        .brand-char:nth-child(3n + 2) { color: var(--c2); }
        .brand-char:nth-child(3n)     { color: var(--c3); }
        .brand-space { width: 0.55em; flex: 0 0 auto; }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-2px); }
        }

        .lang-toggle {
            display: flex;
            gap: 2px;
            padding: 3px;
            border: 1px solid var(--line);
            border-radius: 999px;
            background: var(--card);
        }

        button.lang {
            border: none;
            background: transparent;
            color: var(--muted);
            padding: 5px 13px;
            border-radius: 999px;
            cursor: pointer;
            font: 600 12px/1 inherit;
            font-family: inherit;
            transition: color 0.25s, background 0.3s;
        }
        button.lang:hover { color: var(--ink); }
        button.lang.active { background: var(--ink); color: var(--paper); }

        /* ---------- 主区 ---------- */
        .main {
            flex: 1;
            display: grid;
            grid-template-columns: 1.05fr 0.95fr;
            gap: 56px;
            align-items: center;
            padding: 26px 0;
        }

        h1 {
            font-family: 'Fraunces', 'Noto Serif SC', 'Songti SC', serif;
            font-weight: 600;
            font-size: clamp(28px, 3.4vw, 44px);
            line-height: 1.22;
            letter-spacing: 0.01em;
            margin: 0;
            min-height: 1.2em;
            color: var(--ink);
        }
        /* 主标题用品牌三色渐变文字，作为左侧视觉焦点（不支持时回退纯色） */
        @supports ((-webkit-background-clip: text) or (background-clip: text)) {
            h1 {
                background: linear-gradient(105deg, var(--c1) 0%, var(--c3) 52%, var(--c2) 100%);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                -webkit-text-fill-color: transparent;
            }
        }

        .mark {
            display: flex;
            width: 64px;
            height: 4px;
            border-radius: 2px;
            overflow: hidden;
            margin: 16px 0 20px;
        }
        .mark i { flex: 1; }

        .lede {
            margin: 0;
            max-width: 33em;
            font-size: 15px;
            line-height: 1.72;
            letter-spacing: 0.01em;
            color: var(--muted);
        }

        .meta {
            margin-top: 16px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            column-gap: 2px;
            row-gap: 6px;
            font-size: 12.5px;
            font-weight: 600;
            letter-spacing: 0.01em;
            color: var(--muted);
        }
        .meta i.mdot {
            flex: none;
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--c);
            margin: 0 10px;
            vertical-align: 1px;
        }

        .ticks {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px 22px;
            margin: 20px 0 4px;
            padding: 0;
            list-style: none;
        }
        .ticks li {
            display: flex;
            gap: 11px;
            align-items: flex-start;
            font-size: 13px;
            line-height: 1.5;
            color: var(--muted);
        }
        .ticks li i {
            flex: none;
            width: 6px; height: 6px;
            margin-top: 0.5em;
            border-radius: 50%;
            background: var(--c);
        }

        /* 三个跳转入口 */
        .stores { margin-top: 22px; }
        .store {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 2px;
            border-top: 1px solid var(--line);
            text-decoration: none;
            color: inherit;
            transition: padding-left 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .store:last-child { border-bottom: 1px solid var(--line); }
        .store:hover { padding-left: 10px; }

        .store .ic {
            flex: none;
            width: 36px; height: 36px;
            border-radius: 11px;
            border: 1px solid var(--line);
            display: grid;
            place-items: center;
            color: var(--muted);
            transition: color 0.25s, border-color 0.25s, background 0.25s;
        }
        .store:hover .ic {
            color: var(--b);
            border-color: var(--b);
            background: color-mix(in srgb, var(--b) 8%, transparent);
        }

        .s-main { font-size: 14px; font-weight: 650; }
        .s-sub  { margin-left: auto; font-size: 12px; color: var(--light); }
        .s-arrow {
            color: var(--b);
            display: grid;
            place-items: center;
            opacity: 0;
            transform: translateX(-6px);
            transition: opacity 0.25s, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .store:hover .s-arrow { opacity: 1; transform: none; }

        .store-hint {
            margin: 16px 0 0;
            padding: 11px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 600;
            line-height: 1.5;
            color: var(--ink);
            background: linear-gradient(100deg, rgba(238,90,79,0.10), rgba(155,107,242,0.10) 55%, rgba(63,142,247,0.10));
            border: 1px solid var(--line);
            border-left: 3px solid var(--c1);
            border-radius: 10px;
        }
        .store-hint::before {
            content: "";
            flex: none;
            width: 16px; height: 16px;
            background-color: var(--c1);
            -webkit-mask: var(--star) center / contain no-repeat;
            mask: var(--star) center / contain no-repeat;
        }

        /* ---------- 右侧支持面板 ---------- */
        .panel {
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 24px;
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .panel-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 14px;
        }

        .eyebrow {
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--light);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .eyebrow::before {
            content: "";
            width: 13px; height: 13px;
            background-color: var(--light);
            -webkit-mask: var(--cup) center / contain no-repeat;
            mask: var(--cup) center / contain no-repeat;
        }

        .panel-note { font-size: 12px; color: var(--light); }

        .pay-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .pay-card {
            position: relative;
            overflow: hidden;
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 14px 14px 12px;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.25s;
        }
        .pay-card:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--b) 40%, transparent); }

        .pay-card h3 {
            margin: 0 0 10px;
            font-size: 13.5px;
            font-weight: 700;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 7px;
        }
        .pay-card h3 i {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--b);
        }

        /* 二维码容器固定白底，保证暗色模式下也能扫 */
        .qr {
            background: #fff;
            border-radius: 12px;
            box-shadow: inset 0 0 0 1px rgba(15, 23, 42, 0.06);
        }
        .qr img {
            display: block;
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            border-radius: 6px;
        }

        .pay-card .tip {
            margin: 9px 0 0;
            text-align: center;
            font-size: 11.5px;
            font-weight: 600;
            color: var(--light);
        }

        /* ---------- PayPal 横条：结构不变、保持一行，仅整条可点 ---------- */
        .pp-bar {
            margin-top: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: nowrap;              /* 始终一行 */
            background: var(--paper);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 10px 14px;
            cursor: pointer;                /* 整条可点 */
            transition: border-color 0.25s, box-shadow 0.3s;
        }
        .pp-bar:hover {
            border-color: color-mix(in srgb, var(--ppb) 45%, transparent);
            box-shadow: 0 10px 26px -14px color-mix(in srgb, var(--ppb) 45%, transparent);
        }

        .pp-info { display: flex; align-items: center; gap: 12px; min-width: 0; }
        .pp-word { font-size: 17px; font-weight: 800; font-style: italic; letter-spacing: -0.02em; white-space: nowrap; }
        .pp-word b  { color: var(--pp1); font-weight: 800; }
        .pp-word em { color: var(--pp2); font-style: italic; }
        .pp-tip { font-size: 12px; color: var(--light); }

        .pp-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .pp-actions a {
            text-decoration: none;
            padding: 7px 18px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--card);
            color: var(--ink);
            font-size: 13px;
            font-weight: 700;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), filter 0.2s, border-color 0.2s;
        }
        .pp-actions a:hover { transform: translateY(-2px); border-color: var(--ppb); }
        .pp-actions a:active { transform: scale(0.95); }
        .pp-actions a.featured {
            background: var(--ppb);
            border-color: var(--ppb);
            color: #fff;
            box-shadow: 0 4px 14px -4px color-mix(in srgb, var(--ppb) 60%, transparent);
        }
        .pp-actions a.featured:hover { filter: brightness(1.08); }

        /* ---------- 底部 ---------- */
        .bottom {
            border-top: 1px solid var(--line);
            padding-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .sponsors-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .sponsors-label {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.2em;
            color: var(--light);
        }

        .sponsor-chip {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 5px 12px 5px 6px;
            border-radius: 999px;
            background: var(--card);
            border: 1px solid var(--line);
            transition: border-color 0.25s;
        }
        .sponsor-chip:hover { border-color: color-mix(in srgb, var(--brand) 40%, transparent); }

        .sponsor-avatar {
            width: 22px; height: 22px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 11px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .sponsor-name { font-size: 12.5px; font-weight: 650; }
        .sponsor-amount { font-size: 11px; font-weight: 600; color: var(--light); }

        .sponsors-cta { font-size: 12px; color: var(--light); }
        .sponsors-cta i {
            display: inline-block;
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--c3);
            margin-left: 6px;
            vertical-align: 1px;
        }

        .copyright {
            margin: 0;
            text-align: center;
            font-size: 12px;
            color: var(--light);
        }

        /* ---------- 入场动效 ---------- */
        @keyframes rise {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .anim { opacity: 0; animation: rise 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .d1 { animation-delay: 0.05s; }
        .d2 { animation-delay: 0.18s; }
        .d3 { animation-delay: 0.32s; }

        .store { opacity: 0; animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: calc(0.34s + var(--i) * 70ms); }
        .pay-card { opacity: 0; animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; animation-delay: calc(0.3s + var(--i) * 90ms); }

        @media (max-width: 1023px) {
            .main {
                grid-template-columns: 1fr;
                gap: 36px;
                align-content: start;
                padding: 34px 0;
            }
            .intro { max-width: 620px; }
            .panel { max-width: 480px; }
        }

        @media (max-width: 640px) {
            .page { padding: 18px 20px 24px; }
            .ticks { grid-template-columns: 1fr; }
            .pp-tip { display: none; }          /* 窄屏隐藏提示文字，保证横条仍是一行 */
            .pp-actions a { padding: 7px 13px; }
            .s-sub { display: none; }
        }

        @media (prefers-reduced-motion: reduce) {
            .brand-char, .anim, .store, .pay-card { animation: none; opacity: 1; }
            .store, .pay-card, .pp-bar, .pp-actions a, button.lang { transition: none; }
            .glow { display: none; }
        }
    </style>
</head>

<body>
    <div class="glow" id="glow" aria-hidden="true"></div>

    <div class="page">
        <!-- 顶栏 -->
        <header class="top anim d1">
            <div class="brand">
                <!-- 伞 Logo：三彩伞面 -->
                <svg width="30" height="30" viewBox="0 0 48 48" fill="none" aria-hidden="true">
                    <path d="M6 25A18 18 0 0 1 15 9.41" stroke="#ee5a4f" stroke-width="3.4" stroke-linecap="round"/>
                    <path d="M15 9.41A18 18 0 0 1 33 9.41" stroke="#3f8ef7" stroke-width="3.4" stroke-linecap="round"/>
                    <path d="M33 9.41A18 18 0 0 1 42 25" stroke="#9b6bf2" stroke-width="3.4" stroke-linecap="round"/>
                    <path d="M24 25v12a4.5 4.5 0 0 1-9 0" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                    <path d="M24 7V4" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                </svg>
                <span class="brand-name" id="brand-name" aria-label="COLORFUL BACKGROUND"></span>
            </div>
            <div class="lang-toggle">
                <button class="lang" id="btn-en" onclick="render('en')">EN</button>
                <button class="lang" id="btn-zh" onclick="render('zh')">中文</button>
            </div>
        </header>

        <!-- 主区 -->
        <main class="main">
            <section class="intro anim d1">
                <h1 id="t-title"></h1>
                <span class="mark" aria-hidden="true">
                    <i style="background:var(--c1)"></i><i style="background:var(--c2)"></i><i style="background:var(--c3)"></i>
                </span>
                <p class="lede" id="t-lede"></p>
                <div class="meta" id="t-meta"></div>
                <ul class="ticks" id="t-ticks"></ul>

                <nav class="stores" id="stores" aria-label="links"></nav>
                <p class="store-hint" id="t-storehint"></p>
            </section>

            <!-- 支持面板 -->
            <section class="panel anim d2" aria-label="support">
                <div class="panel-head">
                    <span class="eyebrow" id="t-eyebrow"></span>
                    <span class="panel-note" id="t-panelnote"></span>
                </div>

                <div class="pay-grid">
                    <div class="pay-card" style="--b:#07c160;--i:0">
                        <h3><i></i><span id="title-wechat"></span></h3>
                        <div class="qr"><img src="https://ext-colorful.github.io/images/wechat_a2.png" alt="WeChat Pay QR" decoding="async" /></div>
                        <p class="tip" id="tip-wechat"></p>
                    </div>
                    <div class="pay-card" style="--b:#1677ff;--i:1">
                        <h3><i></i><span id="title-alipay"></span></h3>
                        <div class="qr"><img src="https://ext-colorful.github.io/images/alipay_a2.png" alt="Alipay QR" decoding="async" /></div>
                        <p class="tip" id="tip-alipay"></p>
                    </div>
                </div>

                <!-- 结构与之前完全一致：一行横条 + 三个普通链接，仅多一个 JS 点击事件 -->
                <div class="pp-bar" id="pp-bar">
                    <div class="pp-info">
                        <span class="pp-word" aria-hidden="true"><b>Pay</b><em>Pal</em></span>
                        <span class="pp-tip" id="tip-paypal"></span>
                    </div>
                    <div class="pp-actions">
                        <a data-amt="3" target="_blank" rel="noopener noreferrer">$3</a>
                        <a data-amt="5" class="featured" target="_blank" rel="noopener noreferrer">$5</a>

                .map((t, i) => `<li style="--c:${accentColors[i % accentColors.length]}"><i></i><span>${t}</span></li>`)
                .join("");

                    <span class="sponsor-amount">${s.amount}</span>
                </span>`)
                .join("");

            document.querySelectorAll("button.lang").forEach(btn => {
                const on = btn.id === `btn-${lang}`;
                btn.classList.toggle("active", on);
                btn.setAttribute("aria-pressed", on);
            });

        function getDefaultLang() {
            const param = new URLSearchParams(location.search).get("lang");
            if (param && param !== "default") {
                const base = param.toLowerCase().replace(/_/g, "-").split("-")[0];
                if (base === "zh" || base === "en") return base;
            }
            const locales = navigator.languages?.length ? navigator.languages : [navigator.language];
            return locales.some(l => l.toLowerCase().startsWith("zh")) ? "zh" : "en";
        }

        // ★ PayPal 横条整体可点：点到空白处默认打开 $5；点到内部金额链接则走链接自身
        (function initPaypalBar() {
            const bar = document.getElementById("pp-bar");
            const open = url => window.open(url, "_blank", "noopener");

            // 金额链接的 href 由常量统一生成，改账号只需改 PAYPAL_BASE 一处
            bar.querySelectorAll("a[data-amt]").forEach(a => {
                a.href = PAYPAL_BASE + "/" + a.dataset.amt;
            });

            bar.addEventListener("click", e => {
                if (e.target.closest("a")) return;  // $3/$5/$10 链接自己跳，不干预
                open(PAYPAL_BASE + "/5");           // 点空白处默认 $5
            });
        })();

        // 光标跟随的柔和色晕（尊重系统减弱动效设置）
        (function initGlow() {
            const glow = document.getElementById("glow");
            const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
            if (!glow || reduce || !matchMedia("(hover: hover)").matches) {
                if (glow) glow.style.display = "none";
                return;
            }
            let tx = innerWidth * 0.62, ty = innerHeight * 0.42, x = tx, y = ty, running = false;
            const apply = () => {
                glow.style.transform = `translate3d(${x}px, ${y}px, 0) translate(-50%, -50%)`;
            };
            const loop = () => {
                x += (tx - x) * 0.07;
                y += (ty - y) * 0.07;
                apply();
                // 接近目标坐标即停止循环，静止时不占用 rAF
                if (Math.abs(tx - x) < 0.3 && Math.abs(ty - y) < 0.3) { running = false; return; }
                requestAnimationFrame(loop);
            };
            const start = () => { if (!running) { running = true; requestAnimationFrame(loop); } };
            addEventListener("pointermove", e => { tx = e.clientX; ty = e.clientY; start(); }, { passive: true });
            apply(); // 初次定位一次即可，无需常驻循环
        })();
